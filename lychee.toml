# Link checker settings, used by CI on the built site.
max_retries = 2
timeout = 20
accept = [200, 206, 429]
include_mail = false

# The live site (internal links are checked through the files themselves) and sites that
# block automated requests even though the pages exist.
exclude = [
  "^https://mosiur99\\.github\\.io",
  "^https://codeforces\\.com/",
  "^https://www\\.linkedin\\.com/",
  "^https://www\\.codechef\\.com/",
  "^https://www\\.spoj\\.com/",
  "^https://leetcode\\.com/",
  "^https://www\\.rokomari\\.com",
  "^https://fonts\\.",
]
